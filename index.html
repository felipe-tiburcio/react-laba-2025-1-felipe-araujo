<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <img src="./assets/icons/toggle-light-button.png" class="header__toggle-button"
      alt="Button to toggle light and dark mode">
    <div class="profile">
      <img src="./assets/images/victor-photo.png" alt="Profile Picture" class="profile__picture">
      <div class="profile-info">
        <h1 class="profile-info__name">Victor Alvarado</h1>
        <p class="profile-info__job-title">Software Engineer</p>
        <nav class="profile-info__social-icons">
          <a href="https://github.com/vito8916" target="_blank">
            <img src="./assets/icons/github.png" class="profile-info__social-icons__icon" alt="GitHub"></a>
          <a href="https://x.com/Ar7ois" target="_blank">
            <img src="./assets/icons/twitter-logo.png" class="profile-info__social-icons__icon" alt="Twitter"></a>
          <a href="https://www.linkedin.com/in/victorokada/" target="_blank">
            <img src="./assets/icons/linkedin-logo.png" class="profile-info__social-icons__icon" alt="LinkedIn"></a>
          <a href="https://www.youtube.com/watch?v=sI7pwwUbyAw" target="_blank">
            <img src="./assets/icons/youtube.png" class="profile-info__social-icons__icon" alt="Youtube"></a>
        </nav>
      </div>
    </div>
  </header>

  <main class="achievements">
    <div class="achievement">
      <h2 class="achievement__title">7</h2>
      <p class="achievement__description">Years of work experience</p>
    </div>
    <div class="achievement">
      <h2 class="achievement__title">50+</h2>
      <p class="achievement__description">Completed projects</p>
    </div>
    <div class="achievement">
      <h2 class="achievement__title">20+</h2>
      <p class="achievement__description">Satisfied customers</p>
    </div>
  </main>

  <div class="actions">
    <a class="actions__button actions__button-download-cv" href="./assets/docs/cv-victor-alvarado.pdf" download>Download
      CV
      <img src="./assets/icons/downArrow.svg" class="actions__button-download-cv-icon" alt="Down Arrow Icon"></a>
    <a class="actions__button actions__button-contact-me" href="https://wa.me/5579996444681?text=Hi,Victor!"
      target="_blank">Contact Me</a>
  </div>

  <div class="tabs">
    <button class="tabs__tab tabs__tab-active">Portfolio</button>
    <button class="tabs__tab">Skills</button>
  </div>

  <div class="portfolio">
    <div class="portfolio__project">
      <img src="./assets/images/01-investments.png" class="portfolio__project-img" alt="Investments-Project">
    </div>
    <div class="portfolio__project">
      <img src="./assets/images/02-sam.png" class="portfolio__project-img" alt="Sam's-Project">
    </div>
    <div class="portfolio__project">
      <img src="./assets/images/03-frames.png" class="portfolio__project-img" alt="Arts-Project">
    </div>
    <div class="portfolio__project">
      <img src="./assets/images/04-friday-dinner.png" class="portfolio__project-img" alt="Dinner-Project">
    </div>
    <div class="portfolio__project">
      <img src="./assets/images/05-phone.png" class="portfolio__project-img" alt="Phone-Project">
    </div>
    <div class="portfolio__project">
      <img src="./assets/images/06-food.png" class="portfolio__project-img" alt="Food-Project">
    </div>
  </div>
  <footer>
    <p>&copy; Victor Alvarado, 2025. All rights reserved.</p>
  </footer>
</body>

</html>
